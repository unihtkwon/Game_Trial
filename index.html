<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bingo Game</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ── Header ─────────────────────────────────────────── -->
  <header>
    <h1>BINGO</h1>
    <button class="new-series-btn" onclick="initSeries()">&#x21BA; New Series</button>
  </header>

  <!-- ── Scoreboard ─────────────────────────────────────── -->
  <div class="scoreboard">

    <div class="score-block score-left">
      <span class="score-name p1-name">Player 1</span>
      <span class="score-wins p1-wins" id="seriesWins1">0</span>
    </div>

    <div class="score-center">
      <div class="score-slots" id="scoreSlots">
        <!-- 9 game slots generated by JS -->
      </div>
      <div class="score-info">
        Game <strong id="gameNumDisplay">1</strong> of 9
        &nbsp;&bull;&nbsp; First to 5 wins
      </div>
    </div>

    <div class="score-block score-right">
      <span class="score-wins p2-wins" id="seriesWins2">0</span>
      <span class="score-name p2-name">Player 2</span>
    </div>

  </div>

  <!-- ── Game Area ───────────────────────────────────────── -->
  <main class="game-area">

    <!-- Player 1 -->
    <section class="player-panel" id="panel1">
      <div class="player-header">
        <span class="player-name">Player 1</span>
        <span class="turn-badge">YOUR TURN</span>
      </div>
      <div class="bingo-board" id="board1"></div>
    </section>

    <!-- Center Spin Panel -->
    <section class="spin-panel">
      <div class="turn-indicator">
        <span id="turnText">Player 1's Turn</span>
      </div>

      <div class="spin-display" id="spinDisplay">
        <span id="spinNumber">?</span>
      </div>

      <button class="spin-btn" id="spinBtn" onclick="spin()">
        &#x1F3B0; SPIN!
      </button>

      <div class="called-section">
        <div class="called-title">Called Numbers</div>
        <div class="called-balls" id="calledBalls"></div>
      </div>

      <div class="remaining-info" id="remainingInfo">9 remaining</div>
    </section>

    <!-- Player 2 -->
    <section class="player-panel" id="panel2">
      <div class="player-header">
        <span class="player-name">Player 2</span>
        <span class="turn-badge">YOUR TURN</span>
      </div>
      <div class="bingo-board" id="board2"></div>
    </section>

  </main>

  <!-- ── Game Result Modal (between games) ──────────────── -->
  <div class="modal-overlay" id="gameModalOverlay">
    <div class="modal game-modal">
      <div class="modal-emoji" id="gameEmoji">&#x1F389;</div>
      <h2 class="modal-title" id="gameTitle">Player 1 wins the game!</h2>
      <div class="modal-series-score" id="gameSeriesScore">Series: Player 1  0 – 0  Player 2</div>
      <button class="modal-btn" onclick="nextGame()">Next Game &#x2192;</button>
    </div>
  </div>

  <!-- ── Series Over Modal ──────────────────────────────── -->
  <div class="modal-overlay" id="seriesModalOverlay">
    <div class="modal series-modal">
      <div class="modal-emoji" id="seriesEmoji">&#x1F3C6;</div>
      <h2 class="modal-title" id="seriesTitle">Player 1 Wins the Series!</h2>
      <div class="series-final-score" id="seriesFinalScore">5 – 3</div>
      <div class="series-recap" id="seriesRecap"></div>
      <button class="modal-btn" onclick="initSeries()">New Series</button>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
